[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "llm-tester"
version = "0.1.0"
description = "CLI for testing OpenAI-compatible LLM APIs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LLM Tester" }]
dependencies = [
  "httpx>=0.27",
  "jsonschema>=4.22",
  "pydantic>=2.7",
  "rich>=13.7",
  "typer>=0.12",
  "python-dotenv>=1.0",
]

[project.scripts]
llm-tester = "llm_tester.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["llm_tester"]

[tool.ruff]
line-length = 100
target-version = "py311"
